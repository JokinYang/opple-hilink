[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "opple-hilink"
version = "0.1.0"
description = "OPPLE 读写台灯（HiLink prodId 134D）协议 Python 绑定：本地控制 / 白盒配网帧 / 固件升级"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["opple", "hilink", "coap", "smart-home", "lamp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Home Automation",
]

[tool.maturin]
# 混合布局：wheel 里同时有 opple_hilink/（纯 Python）与 opple_hilink/_native（本扩展）
module-name = "opple_hilink._native"
python-source = "."
strip = true
